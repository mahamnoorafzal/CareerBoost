services:
  mongodb2:
    image: mongo:7
    container_name: careerboost2-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongodb2_data:/data/db

  backend2:
    image: node:22-bookworm-slim
    container_name: careerboost2-backend
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb2:27017/careerboost2
    command: sh -c "npm install && npm start"
    ports:
      - "5002:5000"
    volumes:
      - ./backend:/app
      - backend2_modules:/app/node_modules
      - uploads2:/app/uploads
    depends_on:
      - mongodb2

  frontend2:
    image: node:22-bookworm-slim
    container_name: careerboost2-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REACT_APP_API_URL: http://100.53.182.212:5002/api
    command: sh -c "npm install && npm start"
    ports:
      - "8082:3000"
    volumes:
      - ./frontend:/app
      - frontend2_modules:/app/node_modules
    depends_on:
      - backend2

volumes:
  mongodb2_data:
  backend2_modules:
  frontend2_modules:
  uploads2:
